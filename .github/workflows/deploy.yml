# Deploys the site to GitHub Pages.
#
# DO NOT RUN UNTIL F6 (launch). It is manual-only on purpose: there is no partial
# deploy. Run it only as step 9 of docs/launch-checklist.md, after the repository
# is public and Pages is set to "Source: GitHub Actions". It refuses a dist/ that
# still carries unwritten content (a TODO marker) or a source to be verified.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "launch" to confirm every step of docs/launch-checklist.md before this one is done.'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm == 'launch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Build
        run: npm run build

      - name: Verify the lock in dist/ (ADR 0026)
        run: npm run verify:dist

      - name: Weigh dist/ against the budgets (ADR 0025)
        run: npm run budgets

      # Steps 3 and 8 of docs/launch-checklist.md: by now nothing in dist/ may be left to write
      # (no TODO(launch)) or to verify (a source /sources marks data-unverified).
      - name: Nothing left to write or to verify in dist/
        run: |
          if grep -rl -e 'TODO(' -e 'data-unverified' dist/; then
            echo "dist/ still carries a TODO marker or a source to be verified: see docs/launch-checklist.md."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
