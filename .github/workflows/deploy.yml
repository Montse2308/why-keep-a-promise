# Deploys main to GitHub Pages.
#
# The manual way to publish main, and the only one: there is no deploy on push. It
# first ran as step 7 of docs/launch-checklist.md (F6); since then, Montse runs it
# after merging into main, with confirm = launch. Before publishing it checks main
# again as that step did: check, tests, build, verify:dist and the budgets, and it
# refuses a dist/ that still carries unwritten content (a TODO marker), a source to
# be verified, or a placeholder for the working paper's or the engine's link
# (ADR 0034). Agents never run it.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "launch" to confirm every step of docs/launch-checklist.md before this one is done.'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm == 'launch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Build
        run: npm run build

      - name: Verify the lock in dist/ (ADR 0034)
        run: npm run verify:dist

      - name: Weigh dist/ against the budgets (ADR 0025)
        run: npm run budgets

      # Steps 3 and 4 of docs/launch-checklist.md: by now nothing in dist/ may be left to write
      # (a TODO marker) or to verify (a source /sources marks data-unverified).
      - name: Nothing left to write or to verify in dist/
        run: |
          if grep -rl -e 'TODO(' -e 'data-unverified' dist/; then
            echo "dist/ still carries a TODO marker or a source to be verified: see docs/launch-checklist.md."
            exit 1
          fi

      # Step 3 of docs/launch-checklist.md: the working paper's SSRN link and the engine's DOI are
      # written, so no placeholder is left in dist/, src/ or the READMEs (ADR 0034).
      - name: No placeholder left
        run: node scripts/check-launch.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
